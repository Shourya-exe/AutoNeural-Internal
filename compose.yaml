# ==============================================================================
# AutoNeural workspace on a VPS (Docker + Caddy with automatic HTTPS)
#
#   cp .env.production.example .env.production   # fill in, chmod 600
#   docker compose up -d --build
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    environment:
      - NODE_ENV=production
      - CRM_APP_URL=https://${APP_DOMAIN:-crm.autoneural.in}
      - CRM_DATABASE_PATH=/app/data/autoneural-crm.sqlite
      - CRM_UPLOAD_DIR=/app/data/uploads
    volumes:
      - app_data:/app/data
    expose:
      - "3000"
    # Let in-flight requests finish and SQLite close cleanly on shutdown.
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-crm.autoneural.in}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  app_data:
  caddy_data:
  caddy_config:
