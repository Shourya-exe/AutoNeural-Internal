# Local infrastructure for AutoNeural CRM.
#   docker compose up -d
# Provides PostgreSQL (5432) and Redis (6379) matching .env.example defaults.
services:
  postgres:
    image: postgres:16-alpine
    container_name: autoneural-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoneural
      POSTGRES_PASSWORD: autoneural
      POSTGRES_DB: autoneural_crm
    ports:
      - "5432:5432"
    volumes:
      - autoneural_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoneural -d autoneural_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autoneural-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - autoneural_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autoneural_pgdata:
  autoneural_redisdata:
